<!doctype html>
<!-- Local test page for the web app. Open it from this computer; it is not published. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Backend test</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
  label { display: block; margin-top: 1rem; font-weight: 600; }
  input { width: 100%; padding: .5rem; font: inherit; box-sizing: border-box; }
  button { margin: 1rem .5rem 0 0; padding: .5rem 1rem; font: inherit; }
  pre { background: #f2f0ea; padding: 1rem; white-space: pre-wrap; word-break: break-word; }
</style>
</head>
<body>
<h1>Backend test</h1>
<label>Web app URL <input id="url" autocomplete="off"></label>
<label>Access token <input id="token" type="password" autocomplete="off"></label>
<button data-test="wrong">1. Wrong token</button>
<button data-test="chat">2. Chat</button>
<button data-test="chat-again">3. Chat again</button>
<button data-test="settings">4. Settings</button>
<pre id="out">Results appear here.</pre>
<script>
const out = document.getElementById('out');
const session = 'browser-test-' + Date.now();

async function post(body) {
  const started = Date.now();
  const response = await fetch(document.getElementById('url').value.trim(), {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(body),
  });
  const data = await response.json();
  return ((Date.now() - started) / 1000).toFixed(1) + ' seconds\n' + JSON.stringify(data, null, 2);
}

const tests = {
  wrong: () => post({ token: 'wrong-token', action: 'getSettings' }),
  chat: () => post({ token: token(), action: 'chat', session, message: 'What does my Thursday look like?' }),
  'chat-again': () => post({ token: token(), action: 'chat', session, message: 'And Friday?' }),
  settings: () => post({ token: token(), action: 'getSettings' }),
};
const token = () => document.getElementById('token').value.trim();

document.querySelectorAll('button').forEach((button) => {
  button.addEventListener('click', async () => {
    out.textContent = 'Waiting...';
    try {
      out.textContent = await tests[button.dataset.test]();
    } catch (error) {
      out.textContent = 'FAILED: ' + error.message;
    }
  });
});
</script>
</body>
</html>
