<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src https://script.google.com https://script.googleusercontent.com; base-uri 'none'; form-action 'none'">
<title>Calendar</title>
<meta name="description" content="Personal calendar assistant">
<meta name="theme-color" content="#08080B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Calendar">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preload" href="fonts/montserrat-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
<script type="module" src="app.js"></script>
</head>
<body>
<div class="backdrop" aria-hidden="true"></div>

<main id="setup-view" class="view setup" hidden>
  <form id="setup-form" class="glass">
    <h1>Calendar</h1>
    <p class="status">Connect to your assistant</p>
    <label>Web app URL
      <input id="setup-url" type="url" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" required>
    </label>
    <label>Access token
      <input id="setup-token" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" required>
    </label>
    <p id="setup-status" class="status" role="status"></p>
    <button class="primary" type="submit">Connect</button>
  </form>
</main>

<div id="chat-view" class="view" hidden>
  <header class="bar">
    <h1 id="week-title" class="title">Calendar</h1>
    <div class="bar-actions">
      <button id="clear-chat" class="icon clear" type="button" aria-label="Clear chat" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 13h9l1-13M10 11v5M14 11v5"/></svg>
      </button>
      <button id="week-prev" class="icon" type="button" aria-label="Previous week">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <button id="week-next" class="icon" type="button" aria-label="Next week">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
      </button>
      <button id="open-settings" class="link" type="button">Settings</button>
    </div>
  </header>
  <div id="week" class="week glass"></div>
  <div id="day" class="day glass" hidden></div>
  <div id="scroller" class="scroller">
    <p id="empty" class="empty">How can I help?</p>
    <ol id="log" class="log" aria-live="polite"></ol>
    <section id="proposal" class="proposal glass" hidden>
      <p id="proposal-text" dir="auto"></p>
      <button id="edit-proposal" class="edit-link" type="button" hidden>Edit details</button>
      <div class="actions">
        <button id="confirm" class="primary" type="button">Confirm</button>
        <button id="cancel" class="outline" type="button">Cancel</button>
      </div>
    </section>
  </div>
  <form id="composer" class="composer glass">
    <textarea id="input" rows="1" dir="auto" enterkeyhint="send" placeholder="Message" aria-label="Message"></textarea>
    <div class="composer-actions">
      <button id="voice-language" class="language" type="button" aria-label="Speech language">EN</button>
      <button id="mic" class="icon" type="button" aria-label="Speak" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      </button>
      <button id="send" class="send" type="submit" aria-label="Send">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
      </button>
    </div>
  </form>
</div>

<div id="settings-view" class="view" hidden>
  <header class="bar">
    <button id="close-settings" class="link" type="button">Back</button>
    <h1 class="title">Settings</h1>
    <span class="bar-spacer"></span>
  </header>
  <div id="settings-body" class="scroller settings"></div>
</div>

<dialog id="notice" class="notice glass">
  <p id="notice-text" dir="auto"></p>
  <button id="notice-close" class="primary" type="button">OK</button>
</dialog>

<dialog id="edit-dialog" class="sheet">
  <header class="bar">
    <button id="edit-close" class="link" type="button">Close</button>
    <h1 class="title">Edit details</h1>
    <span class="bar-spacer"></span>
  </header>
  <div id="edit-body" class="scroller settings"></div>
</dialog>

<dialog id="place-dialog" class="sheet">
  <header class="bar">
    <button id="place-close" class="link" type="button">Close</button>
    <h1 class="title" id="place-title">Place</h1>
    <span class="bar-spacer"></span>
  </header>
  <div id="place-body" class="scroller settings"></div>
</dialog>

</body>
</html>
